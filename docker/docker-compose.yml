services:
  myVLA:
    container_name: myVLA
    #image: nvcr.io/nvidia/pytorch:25.01-py3
    image: moonjongsul/myvla:nvcr.io.pytorch-25.01-py3
    tty: true
    ipc: host
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: -1
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - /mnt/synology/RobotData:/mnt/synology
      - ../:/workspace/starVLA:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
